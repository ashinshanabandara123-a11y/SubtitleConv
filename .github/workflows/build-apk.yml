name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          set -e
          zipfile=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" | head -n1)
          if [ -n "$zipfile" ]; then
            echo "Unpacking $zipfile"
            unzip -q -o "$zipfile" -d _src
            root=$(dirname "$(find _src -name settings.gradle.kts | head -n1)")
          else
            root=$(dirname "$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)")
          fi
          echo "PROJECT_DIR=$root" >> "$GITHUB_ENV"
          echo "Project root: $root"
          ls -la "$root"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleConv-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
