
name: Build Subcake APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          unzip -q SubcakeReborn_AndroidStudio_Project_with_GitHub_Actions.zip -d source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle -p source/SubcakeReborn --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubcakeReborn-APK
          path: source/SubcakeReborn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
